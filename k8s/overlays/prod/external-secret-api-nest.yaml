apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-nest-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: api-nest-secrets
    creationPolicy: Owner
  data:
    - secretKey: SERVICE_SECRET
      remoteRef:
        key: /prod/api-nest/service-secret
