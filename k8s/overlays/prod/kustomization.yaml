apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- cluster-secret-store.yaml
- external-secret-api-nest.yaml

patches:
- path: hpa-api-express.yaml

# IMPORTANT: Do not apply this overlay manually before CI has run.
# The image names below are placeholders. CI patches them to full ECR URIs:
#   kustomize edit set image api-nest=<ECR_REGISTRY>/api-nest:<SHA>
# Applying before CI runs will cause ImagePullBackOff (images don't exist on Docker Hub).
images:
