apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base

# IMPORTANT: Do not apply this overlay manually before CI has run.
# The image names below are placeholders. CI patches them to full ECR URIs:
#   kustomize edit set image api-nest=<ECR_REGISTRY>/api-nest:<SHA>
# Applying before CI runs will cause ImagePullBackOff (images don't exist on Docker Hub).
images:
- name: api-express
  newName: <ECR_REGISTRY>/api-express
  newTag: latest
- name: api-nest
  newName: <ECR_REGISTRY>/api-nest
  newTag: latest
- name: api-python
  newName: <ECR_REGISTRY>/api-python
  newTag: latest
- name: web
  newName: <ECR_REGISTRY>/web
  newTag: latest
