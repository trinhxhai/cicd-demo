apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-express
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-express
  template:
    metadata:
      labels:
        app: api-express
    spec:
      containers:
        - name: api-express
          image: api-express:latest
          ports:
            - containerPort: 3001
          env:
            - name: PYTHON_URL
              value: "http://api-python.default.svc.cluster.local:8000"
            - name: PORT
              value: "3001"
          readinessProbe:
            httpGet:
              path: /ping
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
