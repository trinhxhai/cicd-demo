# Hot-reload development environment.
# Prerequisites: run `npm install` on the host before starting.
# Usage: docker compose -f docker-compose.dev.yml up

services:
  api-python:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./apps/api-python:/app
      - pip-cache:/root/.cache/pip
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn main:app --reload --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    networks:
      - app-network

  api-express:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    # Use Nx serve with daemon disabled to avoid container watcher/daemon issues.
    command: npm exec nx serve @org/api-express
    environment:
      - PYTHON_URL=${PYTHON_URL:-http://api-python:8000}
      - PORT=3001
      - NX_DAEMON=false
    ports:
      - "3001:3001"
    networks:
      - app-network
    depends_on:
      - api-python

  api-nest:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    # Use Nx serve with daemon disabled to avoid container watcher/daemon issues.
    command: npm exec nx serve api-nest
    environment:
      - EXPRESS_URL=${EXPRESS_URL:-http://api-express:3001}
      - SERVICE_SECRET=${SERVICE_SECRET:-dev-secret}
      - NX_DAEMON=false
    ports:
      - "3000:3000"
    networks:
      - app-network
    depends_on:
      - api-express

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app/apps/web
    volumes:
      - ./apps:/app/apps
      - ./tsconfig.base.json:/app/tsconfig.base.json
    command: npx next dev --port 4000
    environment:
      - NEST_URL=${NEST_URL:-http://api-nest:3000}
      - NEXT_PUBLIC_BASE_URL=http://localhost:4000
    ports:
      - "4000:4000"
    networks:
      - app-network
    depends_on:
      - api-nest

networks:
  app-network:
    driver: bridge

volumes:
  node_modules:
  pip-cache:
